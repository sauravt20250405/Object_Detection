<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOLOv4 Object Detection</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <div class="logo">NeuralVision AI</div>
        <nav>
            <ul>
                <li><a href="#" class="active">Live Feed</a></li>
                <li><a href="#">Settings</a></li>
                <li><a href="#">About</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="dashboard-container">
            <div class="video-feed-container">
                <div class="video-header">
                    <h2>Live Surveillance Feed</h2>
                    <span class="status-indicator">● Live</span>
                </div>
                <div class="video-wrapper">
                    <img src="{{ url_for('video_feed') }}" alt="YOLOv4 Object Detection Feed">
                </div>
                <div class="video-footer">
                    <div class="stat-item">
                        <span class="label">Model</span>
                        <span class="value">YOLOv4</span>
                    </div>
                    <div class="stat-item">
                        <span class="label">Resolution</span>
                        <span class="value">1280x720</span>
                    </div>
                    <div class="stat-item">
                        <span class="label">Backend</span>
                        <span class="value">OpenCV dnn</span>
                    </div>
                </div>
            </div>

            <div class="sidebar">
                <div class="panel">
                    <h3>System Status</h3>
                    <div class="status-item">
                        <span>Packets</span>
                        <span class="status-ok">Optimal</span>
                    </div>
                    <div class="status-item">
                        <span>Latency</span>
                        <span class="status-ok">Low</span>
                    </div>
                </div>
                <div class="panel">
                    <h3>Detected Classes</h3>
                    <ul class="detection-list" id="detection-list">
                        <!-- Dynamic content -->
                    </ul>
                </div>
            </div>
        </div>
    </main>

    <script>
        function updateStats() {
            fetch('/stats')
                .then(response => response.json())
                .then(data => {
                    const list = document.getElementById('detection-list');
                    list.innerHTML = '';
                    for (const [key, value] of Object.entries(data)) {
                        const li = document.createElement('li');
                        li.innerHTML = `<span>${key}</span> <span class="value">${value}</span>`;
                        li.style.display = 'flex';
                        li.style.justifyContent = 'space-between';
                        list.appendChild(li);
                    }
                })
                .catch(error => console.error('Error fetching stats:', error));
        }
        setInterval(updateStats, 500);
    </script>

    <footer>
        <p>&copy; 2024 NeuralVision AI. Powered by YOLOv4 & Flask.</p>
    </footer>
</body>

</html>
